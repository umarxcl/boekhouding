# Categorisation rules for XCL (Wio export).
# Main rule (Umar, 2-11-2026): if there is a receipt or invoice in Drive, the expense is business; if not, it is private.
# The importer first books per the rule below; the document link (documenten_xcl.yaml) then rebooks to business once a receipt matches.
# Order matters: the first matching rule wins. Matching is case-insensitive on
# "Transaction type", "Description" and "Notes" combined. No rule = Expenses:Suspense with flag "!"
# (goes on the exceptions list). New rules are added here after Umar's approval.
#
# Fields per rule:
#   match:   list of text fragments or regexes (prefix "re:"); all must occur (AND)
#   type:    optional, Wio "Transaction type" (Card, Fees, Transfers, Currency exchange)
#   account: contra account
#   payee:   clean name of the counterparty
#   flag:    optional "!" to always put the item on the exceptions list (e.g. large amounts)
#   currency: optional, only for lines in this currency (EUR or AED)
#   note:    optional, explanation shown on the monthly review list

rules:
  # --- Cash ---------------------------------------------------------------
  # The importer tags the cash withdrawal 'atm withdrawal fee' because Wio books a separate fee line for it.
  - match: ["atm withdrawal"]
    account: Assets:Receivables:Director:Umar
    payee: "Cash withdrawal"
    note: "Cash withdrawal with the XCL card: director's current account (decision 18-10-2026)"

  # --- Villa rent (not yet spread: follows after Umar's decision) ----------
  - match: ["sheikha latifa"]
    type: Transfers
    account: Assets:Prepayments:Housing
    payee: "Landlord villa 1153A (Sheikha Latifa Ahmed Sultan al Qassemi)"
    flag: "!"
    note: "Quarterly villa rent (AED 42,500, 15 May to 14 Aug): prepaid, monthly spreading follows after your decision"
  - match: ["cheque payment"]
    type: Cheque
    account: Assets:Prepayments:Housing
    payee: "Landlord villa (cheque 000002)"
    flag: "!"
    note: "Cheque of AED 42,500, same amount as the quarterly rent: probably rent 15 Aug to 14 Nov; please confirm and provide the cheque copy"
  - match: ["to sajjad hussain"]
    type: Transfers
    account: Assets:Prepayments:Housing
    payee: "Sajjad Hussain"
    flag: "!"
    note: "Rent and commission for the house (description 'Rent and commission Nesma house'): split into rent, commission and deposit needed"
  - match: ["to azeem hussain"]
    type: Transfers
    account: Assets:Receivables:Director:Umar
    payee: "Azeem Hussain"
    flag: "!"
    note: "Description 'Support': probably private (director's current account); who is this and what was it for?"
  # --- Revenue and customers -------------------------------------------
  - match: ["from ekmekci"]
    type: Transfers
    account: Assets:Receivables:Trade:Ekmekci
    payee: "Ekmekci Group B.V."
    note: "Management fee received; settles the open invoice"
  - match: ["from mdi"]
    type: Transfers
    account: Assets:Receivables:Trade:MDI
    payee: "MDI Consultants B.V."
  - match: ["inclusionair"]
    type: Transfers
    account: Assets:Receivables:Trade:Inclusionair
    payee: "Inclusionair"
  - match: ["point sixteen"]
    type: Transfers
    account: Assets:Receivables:Trade:PointSixteen
    payee: "Point Sixteen B.V."

  # --- Money from Umar (private) to XCL ----------------------------------
  # EUR: shareholder loan (EUR account). AED: booked to the director's current account with a flag until Umar decides
  # per transfer (loan, capital or repayment); Liabilities:ShareholderLoan:Umar-AED exists for the loan case.
  - match: ["re:from (hr |mr )?u ?f mirza|from umar"]
    type: Transfers
    currency: EUR
    account: Liabilities:ShareholderLoan:Umar-EUR
    payee: "Umar Fahad Mirza (private)"
    flag: "!"
    note: "Money from Umar (private) to XCL: shareholder loan, unless it is (partly) the AED 48,000 capital payment; to be determined per transfer"
  - match: ["re:from (hr |mr )?u ?f mirza|from umar"]
    type: Transfers
    currency: AED
    account: Assets:Receivables:Director:Umar
    payee: "Umar Fahad Mirza (private)"
    flag: "!"
    note: "Money from Umar (private) to XCL in dirham: loan, capital or repayment? The loan account is EUR only, so temporarily on the director's current account"

  # --- Transfers to Umar ------------------------------------------------
  - match: ["to umar fahad mirza", "salary"]
    type: Transfers
    account: Liabilities:Employees:SalaryPayable-Umar
    payee: "Umar Fahad Mirza"
    note: "Salary payment; reduces salary payable"
  - match: ["re:to umar fahad mirza (n|m)$"]
