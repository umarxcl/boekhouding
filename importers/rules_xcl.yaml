  - match: ["re:efon io|\\bsquare\\b|ziina|nlbcuae|supernova|nextuaeaedecomic|\\bcard e dubai|\\bcard e sas\\b|red desert|danat al rabei|dark door|digital sharjah|masaar|clean car wash"]
