# Categoriseringsregels voor XCL (Wio-export).
# Hoofdregel (Umar, 2-11-2026): is er een bon of factuur in Drive, dan is de uitgave zakelijk; is die er niet, dan privé.
# De importer boekt eerst op de regel hieronder; de documentkoppeling herboekt daarna naar zakelijk zodra een bon matcht.
# Volgorde telt: de eerste regel die past, wint. Matching is hoofdletterongevoelig op
# "Transaction type", "Description" en "Notes" samen. Geen regel = Expenses:Onbekend met vlag "!"
# (komt op de uitzonderingenlijst). Nieuwe regels komen hier bij na goedkeuring van Umar.
#
# Velden per regel:
#   match:   lijst van tekstfragmenten of regex (prefix "re:"); alle moeten voorkomen (AND)
#   type:    optioneel, Wio "Transaction type" (Card, Fees, Transfers, Currency exchange)
#   account: tegenrekening
#   payee:   nette naam van de tegenpartij
#   flag:    optioneel "!" om altijd op de uitzonderingenlijst te zetten (bijv. grote bedragen)
#   currency: optioneel, alleen voor regels in deze valuta (EUR of AED)
#   nl:      optioneel, uitleg die op de maandlijst komt

rules:
  # --- Contant geld ------------------------------------------------------
  # De importer geeft de pinopname een tag 'atm withdrawal fee' omdat Wio daar een aparte kostenregel voor boekt.
  - match: ["atm withdrawal"]
    account: Assets:Rekening-courant:Umar
    payee: "Contante opname"
    nl: "Contante opname met de XCL-pas: rekening-courant directeur (besluit 18-10-2026)"

  # --- Villahuur (nog niet gespreid: dat volgt na besluit Umar) --------------
  - match: ["sheikha latifa"]
    type: Transfers
    account: Assets:Vooruitbetaald:Huisvesting
    payee: "Verhuurder villa 1153A (Sheikha Latifa Ahmed Sultan al Qassemi)"
    flag: "!"
    nl: "Kwartaalhuur villa (AED 42.500, 15 mei t/m 14 aug): vooruitbetaald, spreiding per maand volgt na jouw besluit"
  - match: ["cheque payment"]
    type: Cheque
    account: Assets:Vooruitbetaald:Huisvesting
    payee: "Verhuurder villa (cheque 000002)"
    flag: "!"
    nl: "Cheque van AED 42.500, zelfde bedrag als de kwartaalhuur: waarschijnlijk huur 15 aug t/m 14 nov; bevestig en lever de chequekopie"
  - match: ["to sajjad hussain"]
    type: Transfers
    account: Assets:Vooruitbetaald:Huisvesting
    payee: "Sajjad Hussain"
    flag: "!"
    nl: "Huur en commissie voor het huis (omschrijving 'Rent and commission Nesma house'): splitsing huur, commissie en borg nodig"
  - match: ["to azeem hussain"]
    type: Transfers
    account: Assets:Rekening-courant:Umar
    payee: "Azeem Hussain"
    flag: "!"
    nl: "Omschrijving 'Support': waarschijnlijk privé (rekening-courant); wie is dit en waarvoor?"
  # --- Omzet en klanten -------------------------------------------------
  - match: ["from ekmekci"]
    type: Transfers
    account: Assets:Debiteuren:Ekmekci
    payee: "Ekmekci Group B.V."
    nl: "Ontvangst managementfee; wordt afgeboekt op de openstaande factuur"
  - match: ["from mdi"]
    type: Transfers
    account: Assets:Debiteuren:MDI
    payee: "MDI Consultants B.V."
  - match: ["inclusionair"]
    type: Transfers
    account: Assets:Debiteuren:Inclusionair
    payee: "Inclusionair"
  - match: ["point sixteen"]
    type: Transfers
    account: Assets:Debiteuren:Point-Sixteen
    payee: "Point Sixteen B.V."

  # --- Geld van Umar privé naar XCL ---------------------------------------
  # EUR: lening aandeelhouder (rekening is alleen EUR). AED: de leningrekening kent geen AED; tot Umar beslist
  # (en een AED-rekening is toegevoegd) staat dit op de rekening-courant, met vlag.
  - match: ["re:from (hr |mr )?u ?f mirza|from umar"]
    type: Transfers
    currency: EUR
    account: Liabilities:Lening-aandeelhouder:Umar
    payee: "Umar Fahad Mirza (privé)"
    flag: "!"
    nl: "Geld van Umar privé naar XCL: lening van de aandeelhouder, tenzij het (deels) de kapitaalstorting van AED 48.000 is; vaststellen per overboeking"
  - match: ["re:from (hr |mr )?u ?f mirza|from umar"]
    type: Transfers
    currency: AED
    account: Assets:Rekening-courant:Umar
    payee: "Umar Fahad Mirza (privé)"
    flag: "!"
    nl: "Geld van Umar privé naar XCL in dirham: lening of kapitaal of terugstorting? De leningrekening kent alleen euro, daarom tijdelijk op de rekening-courant"

  # --- Overboekingen naar Umar -------------------------------------------
  - match: ["to umar fahad mirza", "salary"]
    type: Transfers
    account: Liabilities:Personeel:Loonschuld-Umar
    payee: "Umar Fahad Mirza"
    nl: "Salarisbetaling; verlaagt de loonschuld"
  - match: ["re:to umar fahad mirza (n|m)$"]
    type: Transfers
    account: Assets:Rekening-courant:Umar
    payee: "Umar Fahad Mirza"
    flag: "!"
    nl: "Overboeking naar jou met alleen een letter als omschrijving (juli 2026, samen AED 10.000): wat was dit? Zonder uitleg boek ik het als rekening-courant"
  - match: ["to umar fahad mirza", "car rental"]
    type: Transfers
    account: Assets:Rekening-courant:Umar
    payee: "Umar Fahad Mirza"
    flag: "!"
    nl: "Omschrijving 'Car rental': was dit een zakelijke autohuur die jij betaald hebt (dan Auto:Huur) of privé (rekening-courant)?"
  - match: ["to umar fahad mirza"]
    type: Transfers
    account: Assets:Rekening-courant:Umar
    payee: "Umar Fahad Mirza"
    nl: "Overboeking naar privé zonder Salary: rekening-courant directeur (besluit 18-10-2026), later verrekend met de loonschuld"
  - match: ["samira"]
    type: Transfers
    account: Assets:Rekening-courant:Umar
    payee: "Samira (via Umar)"
    nl: "Privé: leefgeld gezin, rekening-courant directeur"

  # --- Leveranciers en overheid -------------------------------------------
  - match: ["rd advisory"]
    account: Expenses:Advies:Corporate-services
    payee: "RD Advisory FZCO"
  - match: ["ifza"]
