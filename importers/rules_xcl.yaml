  - match: ["digital sharjah"]
    account: Expenses:Auto:Tol-parkeren
    payee: "Digital Sharjah (parkeren)"
    nl: "Parkeren in Sharjah: zakelijk (autokosten), bevestigd door Umar 3-11-2026"
  - match: ["efon io"]
    account: Expenses:Telecom
    payee: "Efon.io"
    nl: "Zakelijke telefonie, bevestigd door Umar 3-11-2026"
  - match: ["supernova"]
