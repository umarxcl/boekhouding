    payee: "Careem"

  # --- Telecom ----------------------------------------------------------
  - match: ["e& digital"]
    account: Expenses:Telecom
    payee: "e& (Etisalat)"
  - match: ["etisalat"]
    account: Expenses:Telecom
    payee: "e& (Etisalat)"
  - match: ["re:^du |du telecom"]
