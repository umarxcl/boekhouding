    payee: "Supernova Charters (jachtcharter)"
    flag: "!"
    nl: "Jachtcharter voor zakelijk netwerkevent (Umar 3-11-2026): representatie; vermeld doel en gasten, bon in Drive"
  - match: ["re:tourist hub|clean car wash|red desert|\\bsquare\\b"]
